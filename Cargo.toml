[package]
name = "focus-noise"
version = "0.1.0"
edition = "2021"
description = "A small offline white/brown noise player."
license = "MIT"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0"
cpal = "0.15"
eframe = "0.27"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
